<div class="elite-admin-wrapper" [class.sidebar-collapsed]="isSidebarCollapsed">
    <!-- Sidebar -->
    <aside class="elite-sidebar">
        <div class="brand-area">
            <a routerLink="/admin/dashboard" class="brand-link">
                <div class="brand-emblem">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>
                <div class="brand-meta">
                    <span class="brand-text">SMART SHOP</span>
                    <span class="brand-subtext">UNITED KINGDOM</span>
                </div>
            </a>
            <div class="brand-logo-collapsed">
                <i class="fa-solid fa-bag-shopping"></i>
            </div>
        </div>
        
        <button class="sidebar-collapse-trigger" (click)="toggleSidebar()" [title]="isSidebarCollapsed ? 'Expand' : 'Collapse'">
            <i class="fa-solid" [class.fa-angle-left]="!isSidebarCollapsed" [class.fa-angle-right]="isSidebarCollapsed"></i>
        </button>

        <nav class="nav-menu">
            <div class="nav-section-title">Operational Hub</div>
            <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
                <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
            </a>
            <a routerLink="/admin/orders" routerLinkActive="active" class="nav-item">
                <i class="fa-solid fa-shopping-cart"></i> <span>Manage Orders</span>
            </a>

            <div class="nav-section-title">Marketplace</div>
            <a routerLink="/admin/manage-sellers" routerLinkActive="active" class="nav-item">
                <i class="fa-solid fa-users"></i> <span>Sellers Directory</span>
            </a>
            <a routerLink="/admin/stores" routerLinkActive="active" class="nav-item">
                <i class="fa-solid fa-check-to-slot"></i> <span>Store Approvals</span>
            </a>

            <div class="nav-section-title">Finances & Supply</div>
            <a routerLink="/admin/payouts" routerLinkActive="active" class="nav-item">
                <i class="fa-solid fa-money-bill-transfer"></i> <span>Payout Requests</span>
            </a>
            <a routerLink="/admin/settings" routerLinkActive="active" class="nav-item">
                <i class="fa-solid fa-truck-fast"></i> <span>Logistics & 3PL</span>
            </a>

            <div class="nav-section-title">System Guard</div>
            <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
                <i class="fa-solid fa-user-shield"></i> <span>Staff Management</span>
            </a>
            
            <a href="javascript:void(0)" (click)="logout()" class="nav-item nav-logout">
                <i class="fa-solid fa-power-off"></i> <span>Logout System</span>
            </a>
        </nav>
    </aside>

    <!-- Topbar -->
    <header class="elite-topbar">
        <div class="topbar-left d-flex align-items-center">
            <h4 class="page-context d-none d-md-block">Smart Shop Console</h4>
        </div>

        <div class="topbar-right">
            <div class="topbar-profile">
                <div class="avatar-wrap">
                    <div class="avatar">
                        <i class="fa-solid fa-crown"></i>
                    </div>
                    <span class="status-indicator online"></span>
                </div>
                <div class="profile-info d-none d-sm-flex">
                    <span class="role">Marketplace Director</span>
                    <span class="name">Smart Shop Admin</span>
                </div>
                <i class="fa-solid fa-chevron-down ms-3 dropdown-arrow"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="elite-content-area">
        <div class="content-inner">
            <router-outlet></router-outlet>
        </div>
    </main>

    <!-- Mobile Backdrop -->
    <div class="sidebar-backdrop" (click)="toggleSidebar()"></div>
</div>
